<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262" role="img" aria-label="Argus: A multi-agent research assistant: plans, researches in parallel, writes a cited report, critiques its own draft and loops back to fill the gaps.">
